---
- name: Practice package and service modules
  hosts: web
  become: true
  tasks:
    - name: Install packages on Debian-family systems
      ansible.builtin.apt:
        name: [nginx, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install packages on RHEL-family systems
      ansible.builtin.dnf:
        name: [nginx, curl]
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
