---
- name: Practice file and stat modules
  hosts: web
  become: true
  tasks:
    - name: Create the practice directory
      ansible.builtin.file:
        path: /opt/ansible-modules-practice
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write a practice welcome file
      ansible.builtin.copy:
        content: |
          Ansible module practice
          Managed with a playbook.
        dest: /opt/ansible-modules-practice/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Inspect the welcome file
      ansible.builtin.stat:
        path: /opt/ansible-modules-practice/index.html
      register: welcome_file

    - name: Show whether the file exists
      ansible.builtin.debug:
        msg: "Welcome file exists: {{ welcome_file.stat.exists }}"
