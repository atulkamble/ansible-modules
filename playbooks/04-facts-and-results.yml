---
- name: Practice facts, command, register, and debug
  hosts: web
  tasks:
    - name: Show operating system facts
      ansible.builtin.debug:
        msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} ({{ ansible_facts['os_family'] }})"

    - name: Read the system uptime
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Display the uptime output
      ansible.builtin.debug:
        var: uptime_result.stdout
