---
- name: Practice group and user modules
  hosts: web
  become: true
  tasks:
    - name: Create the trainee group
      ansible.builtin.group:
        name: trainee
        state: present

    - name: Create the trainee user
      ansible.builtin.user:
        name: trainee
        group: trainee
        create_home: true
        shell: /bin/bash
        state: present
